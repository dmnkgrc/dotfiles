version = 1

[selection]
reuse_compatible_current_agent = true
inside_conductor = "conductor"
outside_conductor = "herdr"
fallback = "role-chain-or-stop"
one_writer_per_worktree = true

[environments]
conductor = "CONDUCTOR_WORKSPACE_ID"
herdr = "HERDR_ENV"

[conductor]
session_scope = "current-workspace"
parent_collects_result = true
preserve_child_sessions = true
poll_interval_seconds = 5
result_sections = ["RESULT", "EVIDENCE", "CHANGES", "GAPS", "NEXT"]
local_auth = "macos-keychain"
remote_auth = "environment"

[families.openai_codex]
models = ["gpt-6-sol", "gpt-6-luna", "gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna", "gpt-5.5", "gpt-5.4"]
executors = ["pi"]

[families.anthropic]
models = ["fable-5.1", "fable-5", "opus-5.5", "opus-5", "opus-4-8", "sonnet-5-1m", "sonnet-4-6", "haiku-4-5"]
executors = ["claude", "pi"]
# Pi only while Cursor included API usage remains (apiPercentUsed < 100).

[families.cursor]
models = ["grok-4.7", "grok-4.5", "composer-2.5"]
executors = ["pi"]

[aliases."grok-4.7"]
pi = "grok-4.7@256k"

[aliases."fable-5.1"]
claude = "fable"
pi = "fable-5-1@300k"

[aliases."opus-5.5"]
claude = "claude-opus-5-5"
pi = "opus-5.5@300k"

[aliases."opus-5"]
claude = "opus"
pi = "opus-5@300k"

[agents.pi]
kind = "pi"
provider = "catalog"

[agents.claude]
kind = "claude"
