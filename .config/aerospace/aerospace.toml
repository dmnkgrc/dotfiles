config-version = 2
start-at-login = true
after-startup-command = ['exec-and-forget /usr/bin/python3 ~/.config/aerospace/adaptive.py --watch >> ~/Library/Logs/aerospace-adaptive.log 2>&1']

# Keep the single-window containers that define the two ultrawide columns.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'vertical'
persistent-workspaces = ['B', 'T', 'W', '1', '2', '3']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
exec-on-workspace-change = ['/bin/bash', '-c', '/usr/bin/python3 ~/.config/aerospace/adaptive.py --follow-overlays']
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical = 0
gaps.outer.left = 0
gaps.outer.right = 0
gaps.outer.top = 0
gaps.outer.bottom = 0

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down --boundaries-action wrap-around-the-workspace'
alt-k = 'focus up --boundaries-action wrap-around-the-workspace'
alt-l = 'focus right'

alt-b = 'exec-and-forget /usr/bin/python3 ~/.config/aerospace/adaptive.py --focus browser'
alt-t = 'exec-and-forget /usr/bin/python3 ~/.config/aerospace/adaptive.py --focus terminal'
alt-c = 'exec-and-forget /usr/bin/python3 ~/.config/aerospace/adaptive.py --focus conductor'
alt-m = 'exec-and-forget /usr/bin/python3 ~/.config/aerospace/adaptive.py --focus deezer'
alt-w = 'exec-and-forget /usr/bin/python3 ~/.config/aerospace/adaptive.py --focus telegram'
alt-0 = 'workspace W'
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-w = 'move-node-to-workspace --focus-follows-window W'

alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
f = ['layout floating tiling', 'mode main']
r = ['exec-and-forget /usr/bin/python3 ~/.config/aerospace/adaptive.py --reset', 'mode main']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.finder || test %{app-bundle-id} = com.tdesktop.Telegram || test %{app-bundle-id} = net.whatsapp.WhatsApp || test %{app-bundle-id} = com.deezer.deezer-desktop || test %{app-bundle-id} = com.apple.systempreferences || test %{app-bundle-id} = com.apple.ActivityMonitor || test %{app-bundle-id} = com.anysphere.sand'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = ['layout floating', 'move-node-to-workspace --focus-follows-window T']

[[on-window-detected]]
if = 'test %{window-layout} = floating'
run = 'true'

[[on-window-detected]]
if = 'test %{app-bundle-id} = net.imput.helium'
run = 'move-node-to-workspace --focus-follows-window B'

[[on-window-detected]]
if = 'test %{app-bundle-id} = net.kovidgoyal.kitty || test %{app-bundle-id} = com.mitchellh.ghostty || test %{app-bundle-id} = com.apple.Terminal || test %{app-bundle-id} = com.googlecode.iterm2 || test %{app-bundle-id} = com.conductor.app || test %{app-bundle-id} = dev.zed.Zed || test %{app-bundle-id} = com.openai.codex || test %{app-bundle-id} = com.openai.chat || test %{app-bundle-id} = com.t3tools.t3code || test %{app-bundle-id} = com.figma.Desktop'
run = 'move-node-to-workspace --focus-follows-window T'

[[on-window-detected]]
if = 'true'
run = 'move-node-to-workspace --focus-follows-window W'
