onboarding = false

[terminal]
default_shell = "/usr/local/bin/fish"

[keys]
prefix = "ctrl+a"

# boat.dev sandbox
[[keys.command]]
key = "prefix+alt+b"
type = "plugin_action"
command = "boat.open"
description = "Open boat sandbox"

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "boat.pull"
description = "Pull boat sandbox into worktree"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "boat.stop"
description = "Stop boat sandbox"

[[keys.command]]
key = "prefix+alt+i"
type = "plugin_action"
command = "boat.status"
description = "Boat sandbox status"

[theme]
name = "vesper"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[experimental]
allow_nested = true
kitty_graphics = true

# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"
